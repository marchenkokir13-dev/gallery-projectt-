<!DOCTYPE html>
<html>
<head>
    <title>Horse Table</title>
</head>
<body>

<h1>Horse Comparison</h1>

<table border="1">
    <caption>Horse Types and Characteristics</caption>

    <tr>
        <th colspan="3">Horse Information</th>
    </tr>

    <tr>
        <th>Type</th>
        <th>Speed</th>
        <th>Strength</th>
    </tr>

    <tr>
        <td>Arabian</td>
        <td>Fast</td>
        <td>Medium</td>
    </tr>

    <tr>
        <td>Thoroughbred</td>
        <td>Very Fast</td>
        <td>Low</td>
    </tr>

    <tr>
        <td>Clydesdale</td>
        <td>Slow</td>
        <td>Very Strong</td>
    </tr>

</table>

<h2>Conclusions:</h2>

<ul>
  
    <li>Thoroughbred horses are the fastest.</li>
    <li>Clydesdale horses are the strongest.</li>
    <li>Arabian horses are balanced.</li>
</ul>

</body>
</html>
